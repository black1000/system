
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品情報変更</title>

  <link rel="stylesheet"
        href="/css/style.css"
        th:href="@{/css/style.css}">
</head>

<body>
  <main class="product-update-container">

    <h1 class="page-title">
      商品情報変更
    </h1>

    <p class="page-description">
      変更する商品情報を入力してください。
    </p>

    <!-- 更新完了メッセージ -->
    <p class="success-message"
       th:if="${message}"
       th:text="${message}">
      商品情報を更新しました。
    </p>

    <!-- エラーメッセージ -->
    <p class="error-message"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
      入力内容を確認してください。
    </p>

    <nav class="top-navigation">
      <a href="#"
         th:href="@{/admin/products}"
         class="page-link">
        ［商品一覧に戻る］
      </a>
    </nav>

    <form action="#"
          th:action="@{/admin/products/{id}(
            id=${uniform.productno}
          )}"
          th:object="${uniform}"
          method="post">

      <table class="input-table">
        <tbody>

          <!-- 商品番号 -->
          <tr>
            <th>
              <label for="productno">
                商品番号
              </label>
            </th>

            <td>
              <input id="productno"
                     type="text"
                     th:field="*{productno}"
                     readonly
                     class="readonly-input">
            </td>
          </tr>

          <!-- 商品名 -->
          <tr>
            <th>
              <label for="productname">
                商品名
              </label>
            </th>

            <td>
              <input id="productname"
                     type="text"
                     th:field="*{productname}"
                     maxlength="100"
                     required>

              <p class="field-error"
                 th:if="${#fields.hasErrors('productname')}"
                 th:errors="*{productname}">
                商品名の入力に誤りがあります。
              </p>
            </td>
          </tr>

          <!-- 税込価格 -->
          <tr>
            <th>
              <label for="price">
                税込価格
              </label>
            </th>

            <td>
              <div class="input-with-unit">
                <input id="price"
                       type="number"
                       th:field="*{price}"
                       min="0"
                       step="1"
                       required>

                <span class="unit">円</span>
              </div>

              <p class="field-error"
                 th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}">
                税込価格の入力に誤りがあります。
              </p>
            </td>
          </tr>

          <!-- 在庫数 -->
          <tr>
            <th>
              <label for="stock">
                在庫数
              </label>
            </th>

            <td>
              <div class="input-with-unit">
                <input id="stock"
                       type="number"
                       th:field="*{stock}"
                       min="0"
                       step="1"
                       required>

                <span class="unit">枚</span>
              </div>

              <p class="field-error"
                 th:if="${#fields.hasErrors('stock')}"
                 th:errors="*{stock}">
                在庫数の入力に誤りがあります。
              </p>
            </td>
          </tr>

        </tbody>
      </table>

      <div class="button-area">
        <button type="submit" class="update-button">
          変更内容を保存
        </button>
      </div>

    </form>

  </main>
</body>
</html>
