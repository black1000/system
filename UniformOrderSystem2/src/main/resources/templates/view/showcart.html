
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>カート情報</title>

  <link rel="stylesheet"
        href="/css/style.css"
        th:href="@{/css/style.css}">
</head>

<body>
  <main class="cart-container">

    <h1 class="page-title">カート情報</h1>

    <nav class="top-navigation">
      <a class="page-link"
         href="#"
         th:href="@{/products}">
        ［商品一覧に戻る］
      </a>
    </nav>

    <p class="error-message"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
      カートの内容を確認してください。
    </p>

    <div class="table-scroll">
      <table class="cart-table">
        <thead>
          <tr>
            <th>商品名</th>
            <th>税込価格</th>
            <th>購入個数</th>
          </tr>
        </thead>

        <tbody>
          <!-- カート内の商品を繰り返し表示 -->
          <tr th:each="item : ${cartItems}">

            <td th:text="${item.productname}">
              ユニフォームA
            </td>

            <td class="nowrap"
                th:text="${#numbers.formatInteger(
                  item.price, 1, 'COMMA'
                )} + '円'">
              3,000円
            </td>

            <td class="nowrap"
                th:text="${item.quantity} + '枚'">
              5枚
            </td>
          </tr>

          <!-- カートが空の場合 -->
          <tr th:if="${cartItems == null
                      or #lists.isEmpty(cartItems)}">
            <td colspan="3">
              カートに商品はありません。
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 合計金額 -->
    <div class="total-area">
      <span>合計金額：</span>

      <strong th:text="${#numbers.formatInteger(
        totalPrice != null ? totalPrice : 0,
        1,
        'COMMA'
      )} + '円'">
        150,000円
      </strong>
    </div>

    <!-- 商品がある場合だけ購入ボタンを表示 -->
    <form action="/buyComfirm"
          th:action="@{/order/checkout}"
          method="post"
          th:if="${cartItems != null
                  and !#lists.isEmpty(cartItems)}">

      <div class="button-area">
        <button class="purchase-button" type="submit">
          購入
		  <input type="hidden" name="payment" th:value="1">
		  <input type="hidden" name="shipment" th:value="1">
        </button>
      </div>

    </form>

  </main>
</body>
</html>
