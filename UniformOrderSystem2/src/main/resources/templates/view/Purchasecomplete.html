
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>購入完了</title>

  <link rel="stylesheet"
        href="/css/style.css"
        th:href="@{/css/style.css}">
</head>

<body>
  <main class="purchase-complete-container">

    <h1 class="page-title">購入完了</h1>

    <div class="complete-message">
      <p>下記の商品を購入しました。</p>
      <p>ご利用ありがとうございました。</p>
    </div>

    <p class="mail-message">
      購入内容と振込先をメールでお送りしました。
    </p>

    <!-- 注文番号を表示する場合 -->
    <p class="order-number"
       th:if="${order != null}">
      注文番号：
      <strong th:text="${order.orderno}">
        0001
      </strong>
    </p>

    <div class="table-scroll">
      <table class="purchase-table">
        <thead>
          <tr>
            <th>商品名</th>
            <th>税込価格</th>
            <th>購入個数</th>
            <th>小計</th>
          </tr>
        </thead>

        <tbody>
          <!-- 購入した商品を繰り返し表示 -->
          <tr th:each="detail : ${orderDetails}">

            <td>
              <a class="product-link"
                 href="#"
                 th:href="@{/products/{id}(
                   id=${detail.productno}
                 )}"
                 th:text="${detail.productname}">
                ユニフォームA
              </a>
            </td>

            <td class="nowrap"
                th:text="${#numbers.formatInteger(
                  detail.price, 1, 'COMMA'
                )} + '円'">
              3,000円
            </td>

            <td class="nowrap"
                th:text="${detail.quantity} + '枚'">
              5枚
            </td>

            <td class="nowrap"
                th:text="${#numbers.formatInteger(
                  detail.price * detail.quantity,
                  1,
                  'COMMA'
                )} + '円'">
              15,000円
            </td>
          </tr>

          <tr th:if="${orderDetails == null
                      or #lists.isEmpty(orderDetails)}">
            <td colspan="4">
              購入した商品を表示できませんでした。
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 合計金額 -->
    <div class="total-area">
      <span>合計金額：</span>

      <strong th:text="${#numbers.formatInteger(
        order.totalprice, 1, 'COMMA'
      )} + '円'">
        150,000円
      </strong>
    </div>

    <nav class="page-navigation">
      <a class="page-link"
         href="#"
         th:href="@{/products}">
        商品一覧へ
      </a>
    </nav>

  </main>
</body>
</html>
