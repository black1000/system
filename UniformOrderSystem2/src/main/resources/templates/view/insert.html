
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品登録画面</title>

  <link rel="stylesheet"
        href="/css/style.css"
        th:href="@{/css/style.css}">
</head>

<body>
  <main class="product-registration">

    <h1 class="page-title">新規商品登録</h1>

    <p class="success-message"
       th:if="${message}"
       th:text="${message}">
      商品を登録しました。
    </p>

    <p class="error-message"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
      入力内容を確認してください。
    </p>

    <nav class="top-navigation">
      <a class="page-link"
         href="/admin/menu"
         th:href="@{/admin/menu}">
        ［管理者メニューに戻る］
      </a>
    </nav>

    <form action="/admin/products"
          th:action="@{/admin/products}"
          th:object="${product}"
          method="post">

      <table class="input-table">
        <tbody>
          <tr>
            <th>
              <label for="productno">
                商品番号
                <span class="required">必須</span>
              </label>
            </th>

            <td>
              <input id="productno"
                     type="text"
                     th:field="*{productno}"
                     maxlength="4"
                     placeholder="0001"
                     required>
            </td>
          </tr>

          <tr>
            <th>
              <label for="productname">
                商品名
                <span class="required">必須</span>
              </label>
            </th>

            <td>
              <input id="productname"
                     type="text"
                     th:field="*{productname}"
                     maxlength="100"
                     placeholder="ユニフォームA"
                     required>
            </td>
          </tr>

          <tr>
            <th>
              <label for="price">
                税込価格
                <span class="required">必須</span>
              </label>
            </th>

            <td>
              <input id="price"
                     type="number"
                     th:field="*{price}"
                     min="0"
                     step="1"
                     placeholder="3000"
                     required>

              <span class="unit">円</span>
            </td>
          </tr>

          <tr>
            <th>
              <label for="stock">
                在庫数
                <span class="required">必須</span>
              </label>
            </th>

            <td>
              <input id="stock"
                     type="number"
                     th:field="*{stock}"
                     min="0"
                     step="1"
                     placeholder="10"
                     required>

              <span class="unit">枚</span>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="button-area">
        <button class="register-button" type="submit">
          商品登録
        </button>
      </div>

    </form>

  </main>
</body>
</html>
