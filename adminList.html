<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品一覧</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 p-4 text-gray-800">
  <main class="mx-auto my-8 max-w-3xl rounded-lg bg-white p-6 shadow">
    <h1 class="mb-6 text-center text-2xl font-bold">
      商品一覧
    </h1>

    <p id="quantity-help" class="mb-4 text-sm text-red-600">
    売り切れの商品があります。
    </p>

    <form action="/cart/add" method="post">
      <div class="overflow-x-auto">
        <table class="w-full border-collapse text-center">
          <thead class="bg-blue-100">
            <tr>
             <th scope="col" class="border border-gray-300 px-4 py-3">
                商品No.
              </th>
              <th scope="col" class="border border-gray-300 px-4 py-3">
                商品名
              </th>
              <th scope="col" class="border border-gray-300 px-4 py-3">
                税込価格
              </th>
              <th scope="col" class="border border-gray-300 px-4 py-3">
                在庫数
              </th>
              <th scope="col" class="border border-gray-300 px-4 py-3">
                商品情報変更/削除
              </th>
            </tr>
          </thead>

          <tbody>
            <!-- 商品 在庫10-->
            <tr>
             <td class="border border-gray-300 px-4 py-3">
                1
              </td>
              <td class="border border-gray-300 px-4 py-3">
                <a href="/products/1"
                   class="text-blue-700 underline hover:text-blue-900">
                  ユニフォームA
                </a>
                <input type="hidden" name="productIds" value="1">
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                3,000円
              </td>

              <td class="border border-gray-300 px-4 py-3">
                10枚
              </td>

              <td class="border border-gray-300 px-4 py-3">
             <nav
      aria-label="管理者による商品情報の操作"
      class="mt-6 flex flex-wrap justify-center gap-6">


      <a href="/"
         class="text-blue-700 underline hover:text-blue-900">
        変更
      </a>

      <a href="/"
         class="text-blue-700 underline hover:text-blue-900">
        削除
      </a>
    </nav>
              </td>
            </tr>

            <!-- 商品 在庫5-->
            <tr>
                  <td class="border border-gray-300 px-4 py-3">
                2
              </td>
              <td class="border border-gray-300 px-4 py-3">
                <a href="/products/2"
                   class="text-blue-700 underline hover:text-blue-900">

                <input type="hidden" name="productIds" value="2">
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                4,000円
              </td>

              <td class="border border-gray-300 px-4 py-3">
                5枚
              </td>

              <td class="border border-gray-300 px-4 py-3">
         <nav
      aria-label="管理者による商品情報の操作"
      class="mt-6 flex flex-wrap justify-center gap-6">


      <a href="/"
         class="text-blue-700 underline hover:text-blue-900">
        変更
      </a>

      <a href="/"
         class="text-blue-700 underline hover:text-blue-900">
        削除
      </a>
    </nav>
              </td>
            </tr>

            <!-- 商品 在庫なし -->
            <tr class="bg-gray-50">
                  <td class="border border-gray-300 px-4 py-3">

              </td>
              <td class="border border-gray-300 px-4 py-3">

                   class="text-blue-700 underline hover:text-blue-900">
                  ユニフォームC
                </a>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">

              </td>

              <td class="border border-gray-300 px-4 py-3 font-bold text-red-700">
                売り切れ
              </td>

              <td class="border border-gray-300 px-4 py-3">
                     <nav
      aria-label="管理者による商品情報の操作"
      class="mt-6 flex flex-wrap justify-center gap-6">


      <a href="/"
         class="text-blue-700 underline hover:text-blue-900">
        変更
      </a>

         class="text-blue-700 underline hover:text-blue-900">

      </a>
    </nav>

      </a>

      <a href="/"
         class="text-blue-700 underline hover:text-blue-900">

    </nav>

            </tr>

            <tr>
                  <td class="border border-gray-300 px-4 py-3">
                5
              </td>
              <td class="border border-gray-300 px-4 py-3">
                <a href="/products/5"
                   class="text-blue-700 underline hover:text-blue-900">
                  ユニフォームE
                </a>
                <input type="hidden" name="productIds" value="5">

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">

              <td class="border border-gray-300 px-4 py-3">

              </td>

    <nav aria-label="管理者用メニュー" class="mt-6 text-right">
      <a href="/"
         class="text-sm text-green-600 underline hover:text-green-900">

  </main>

</html>
