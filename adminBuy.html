<!DOCTYPE html>
	<html lang="ja">
		<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>（管理者）注文の詳細</title>
		<link rel="stylesheet" href="style.css">
		<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<header class="app-header">
  <div class="nav-bar px-4 sm:px-6 lg:px-8">

  <!-- メニュー内容 -->
  <div class="hamburger-menu" id="menu">
    <h1 class="text-2xl font-bold text-black-600 mb-4bg-gray-100 flex items-center justify-center min-h-[30vh]">注文詳細</h1>
  </div>
</header>
	<div class="bg-gray-100 flex items-center justify-center min-h-screen">
	<div class="text-align: center">
				<div id="main" class="container">

			<!-- 注文の詳細 -->
			<form>
				<table class="input-table" align="center">
				<tr>
				 <th>注文No.</th>
				 <td>0001</td>
				</tr>
					<tr>
						<th>注文者:</th>
						<td>
							<input type="text" name="isbn" value="神田太郎">
							<p></p>
						</td>
					</tr>
					
					<tr>
						<th>メールアドレス:</th>
						<td>
							<input type="text" name="title" value="kanda@email.com">
							<p></p>
						</td>
					</tr>
					
					<tr>
						<th>住所:</th>
						<td>
							<input type="text" name="title" value="XX県XX丁目XXX-X">
							<p></p>
						</td>
					</tr>
					
					<tr>
						<th>商品種類と個数:</th>
						<td>
							<select name="goods" id="goods-select">
                    <option value="all">すべての商品</option>
                                 <option value="uniformA">ユニフォームA</option>
                                  <option value="uniformB">ユニフォームB</option>
                                   <option value="uniformC">ユニフォームC</option>
                                  <option value="uniformD">ユニフォームD</option>
                                  <option value="uniformE">ユニフォームE</option>
                                    <option value="uniformF">ユニフォームF</option>
                                 </select>
						</td>
					</tr>
					
					<tr>
						<th></th>
						<td>
							<input type="text" name="title" value="10" size="2" class="border px-2 py-1 rounded">枚
						</td>
					</tr>
					
					
				</table>
				
				
				<form>
				<table class="input-table" align="center">
					<tr>
						<th>合計価格（税込み）:</th>
						<td>
							<input type="text" name="isbn" value="￥X,XXX">
							<p></p>
						</td>
					</tr>
				</table>
				<div>
				<br>
				</div>
				
				<table>
				<tr>
				<th>入金状況と発送状況：</th>
				<td><select name="nyuukin" id="nyuukin-select">
                    <option value="nyuukinzumi">入金状況</option>
                                 <option value="nyuukinmati">入金待ち</option>
                                 </select>
                                </td>
                    
                        
                    <td><select name="hassou" id="hassou-select">
                    <option value="hassouzumi">発送状況</option>
                                 <option value="junbityuu">済</option>
                                 </select>
                                </td>
                                </tr>
                                </table>
                                <div style="text-align: center">
                                 <button
          type="submit"
          class="rounded bg-blue-600 px-6 py-3 font-bold text-white
                 hover:bg-blue-700 focus:outline-none
                 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">状況変更する
          
        </button>
        </div>
			</form>
		</div>
</body>
</html>
