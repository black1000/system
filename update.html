<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品情報変更</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 p-4 text-gray-800">

  <main class="mx-auto my-8 max-w-3xl rounded-lg bg-white p-6 shadow">

    <h1
      class="mb-4 border-b border-gray-200 pb-3
             text-center text-2xl font-bold">
      商品情報変更
    </h1>

    <p class="mb-5 text-center text-gray-600">
      変更する商品情報を入力してください。
    </p>

    <nav class="mb-5">
      <a href="#"
         class="text-blue-700 underline hover:text-blue-900">
        ［商品一覧に戻る］
      </a>
    </nav>

    <form action="#" method="post">

      <table class="w-full border-collapse">
        <tbody>

          <!-- 商品番号 -->
          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="productno">
                商品番号
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <input
                id="productno"
                type="text"
                name="productno"
                value="0001"
                readonly
                class="w-full rounded border border-gray-300
                       bg-gray-100 p-2 text-gray-600">
            </td>
          </tr>

          <!-- 商品名 -->
          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="productname">
                商品名
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <input
                id="productname"
                type="text"
                name="productname"
                value="ユニフォームA"
                maxlength="100"
                required
                class="w-full rounded border border-gray-500
                       bg-white p-2
                       focus:outline-none focus:ring-2
                       focus:ring-blue-500">
            </td>
          </tr>

          <!-- 税込価格 -->
          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="price">
                税込価格
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <div class="flex items-center gap-2">
                <input
                  id="price"
                  type="number"
                  name="price"
                  value="3000"
                  min="0"
                  step="1"
                  required
                  class="w-full rounded border border-gray-500
                         bg-white p-2
                         focus:outline-none focus:ring-2
                         focus:ring-blue-500">

                <span class="whitespace-nowrap">円</span>
              </div>
            </td>
          </tr>

          <!-- 在庫数 -->
          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="stock">
                在庫数
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <div class="flex items-center gap-2">
                <input
                  id="stock"
                  type="number"
                  name="stock"
                  value="150"
                  min="0"
                  step="1"
                  required
                  class="w-full rounded border border-gray-500
                         bg-white p-2
                         focus:outline-none focus:ring-2
                         focus:ring-blue-500">

                <span class="whitespace-nowrap">枚</span>
              </div>
            </td>
          </tr>

        </tbody>
      </table>

      <div class="mt-8 text-center">
        <button
          type="submit"
          class="rounded bg-blue-600 px-8 py-3
                 font-bold text-white
                 hover:bg-blue-700
                 focus:outline-none focus:ring-2
                 focus:ring-blue-500 focus:ring-offset-2">
          変更内容を保存
        </button>
      </div>

    </form>

  </main>

</body>
</html>
