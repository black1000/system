<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>商品情報変更画面</title>
<style>
.example{
    width: fit-content;
    margin: auto;
    border: 1px solid #333;
    background: #e3f5ff;
}
</style>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 p-4 text-gray-800">
  <main class="mx-auto my-8 max-w-3xl rounded-lg bg-white p-6 shadow"><!-- ブラウザ全体 -->
	<div id="wrap">

		<!-- ヘッダー部分 -->
		<h1 style="text-align: center">商品情報更新</h1>
		<hr>
	
	<br>
	<a style="text-align: left" href="/#">[管理者メニューに戻る]</a>

<hr>
		</header>
		<!-- メニュー部分 -->
		<div id="menu">

			<!-- ページタイトル -->
			<div id="page_title">
				<br>
			</div>
			
		</div>
		<!-- ログインフォーム部分 -->
		<div style="text-align: center">
			
			<form class="example">
				<table>
					<tr>
						<th>商品番号</th>
						<td>００００</td>
						<td></td>
					</tr>
					<tr>
						<th>商品名</th>
						<td>XXXXユニフォーム（例）</td>
						<td><input type="text" name="newgoodsName"></td>
						<td><button class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                  変更
                </button>
					</tr>
					<tr>
						<th>価格(税込み)</th>
						<td>￥ X,XXX（例）</td>
						<td><input type="text" name="price"></td>
						<td><button class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                  変更
                </button>
					</tr>
					<tr>
						<th>在庫数</th>
						<td>XXXX 枚（例）</td>
						<td><input type="text" name="quantity"></td>
						<td><button class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                  変更
                </button>
					</tr>
				


				</table>
				<br>
		
		<br>

			</form>
</div>

			<!-- フッター部分 -->
		
		
		</div>
	</main>

</body>

</html>
