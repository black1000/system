<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>会員情報変更</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 p-4 text-gray-800">

  <main class="mx-auto my-8 max-w-3xl rounded-lg bg-white p-6 shadow">

    <h1
      class="mb-4 border-b border-gray-200 pb-3
             text-center text-2xl font-bold">
      会員情報変更
    </h1>

    <p class="mb-5 text-center text-gray-600">
      変更する内容を入力してください。
    </p>

    <nav class="mb-5">
      <a href="#"
         class="text-blue-700 underline hover:text-blue-900">
        ［会員メニューに戻る］
      </a>
    </nav>

    <form action="#" method="post">

      <table class="w-full border-collapse">
        <tbody>


          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="name">
                名前

               
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <input
                id="name"
                type="text"
                name="name"
                value="神田太郎"
                maxlength="100"
                required
                class="w-full rounded border border-gray-500
                       bg-white p-2
                       focus:outline-none focus:ring-2
                       focus:ring-blue-500">
            </td>
          </tr>


          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="email">
                メールアドレス

                
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <input
                id="email"
                type="email"
                name="email"
                value="test@email.com"
                maxlength="100"
                required
                class="w-full rounded border border-gray-500
                       bg-white p-2
                       focus:outline-none focus:ring-2
                       focus:ring-blue-500">
            </td>
          </tr>


          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="address">
                住所

                
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <textarea
                id="address"
                name="address"
                rows="5"
                maxlength="255"
                required
                class="w-full resize-y rounded
                       border border-gray-500 bg-white p-2
                       focus:outline-none focus:ring-2
                       focus:ring-blue-500">test県test市1-2-3</textarea>
            </td>
          </tr>


          <tr>
            <th
              class="w-1/3 border border-gray-300 bg-blue-100
                     px-4 py-3 text-left">
              <label for="password">
                新しいパスワード
              </label>
            </th>

            <td class="border border-gray-300 px-4 py-3">
              <input
                id="password"
                type="password"
                name="password"
                maxlength="20"
                class="w-full rounded border border-gray-500
                       bg-white p-2
                       focus:outline-none focus:ring-2
                       focus:ring-blue-500">

              
            </td>
          </tr>

        </tbody>
      </table>

      <div class="mt-8 text-center">
        <button
          type="submit"
          class="rounded bg-blue-600 px-8 py-3
                 font-bold text-white
                 hover:bg-blue-700
                 focus:outline-none focus:ring-2
                 focus:ring-blue-500 focus:ring-offset-2">
          変更内容を保存
        </button>
      </div>

    </form>

  </main>

</body>
</html>
