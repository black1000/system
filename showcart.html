<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
            <title>カート情報</title>
            <link rel="stylesheet" href="style.css">
            <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
 <main class="mx-auto my-8 max-w-3xl rounded-lg bg-white p-6 shadow">
    <h1 class="mb-6 text-center text-2xl font-bold">

    <br>
    <a style="text-align: left" href="/#">[商品一覧に戻る]</a>
    <hr>
    <div class="overflow-x-auto">
        <table class="w-full border-collapse text-center">

              <th scope="col" class="border border-gray-300 px-4 py-3">
                商品名
              </th>
              <th scope="col" class="border border-gray-300 px-4 py-3">
                税込価格

              <th scope="col" class="border border-gray-300 px-4 py-3">
                購入個数
              </th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td class="border border-gray-300 px-4 py-3">
                  ユニフォームA

                <input type="hidden" name="productIds" value="1">
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                3,000円
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                5枚
              </td>
            </tr>

            <tr>
              <td class="border border-gray-300 px-4 py-3">
                  ユニフォームB
                <input type="hidden" name="productIds" value="2">
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                4,000円
              </td>

               <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                15枚
              </td>
            </tr>

            <tr class="bg-gray-50">
              <td class="border border-gray-300 px-4 py-3">
                  ユニフォームC
 
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                5,000円
              </td>

              <td class="border border-gray-300 px-4 py-3 text-sm text-gray-600">
                8枚
              </td>
            </tr>

            <tr>
              <td class="border border-gray-300 px-4 py-3">
                                 ユニフォームD
                <input type="hidden" name="productIds" value="4">
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                3,500円
              </td>

              <td class="whitespace-nowrap border border-gray-300 px-4 py-3">
                10枚
              </td>
            </tr>
	

            </table>
            <table>
    <tr>
    	<td style="background-color:#6666ff;">合計:<td>150,000円
    </tr>

    
      </table>
      <div style="text-align: center">
<button class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                  購入
                </button>
                </div>
    


</body>

</html>
